<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>get 방식 로그인</h1>
    <form action="http://localhost:3000/getLogin" method="get">
      id : <input type="text" name="id" /> <br />
      pw : <input type="password" name="pw" /> <br />
      <input type="submit" value="로그인" /> <br />
    </form>

    <h1>post 방식 로그인</h1>
    <form action="http://localhost:3000/postLogin" method="post">
      id : <input type="text" name="id" /> <br />
      pw : <input type="password" name="pw" /> <br />
      <input type="submit" value="로그인" /> <br />
    </form>
  </body>
</html>
