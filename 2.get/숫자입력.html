<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>숫자를 입력하세요.</h1>
    <!-- form태그 : 사용자가 입력한 값을 전달하기 위해 만든 폼태그
        method : 전달방식, action : 전달 위치 
    -->
    <form action="http://localhost:3300" method="get">
        <input type="text" name="num1" />
        <input type="text" name="num2"/>
        <input type="submit"/>
    </form>
</body>
</html>
